services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: docflow_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    container_name: docflow_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: docflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: docflow
      POSTGRES_USER: docflow_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - docflow_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: docflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - docflow_redisdata:/data

volumes:
  docflow_pgdata:
  docflow_redisdata: